name: Verify CARL

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - run: uv lock --check
      - run: uv sync --locked --extra dev --extra training --extra mcp --extra cli --extra observe --extra hf --extra constitutional --extra secrets
      - run: uv run --locked --no-sync pytest tests/ packages/carl-core/tests/ -q --tb=short
      - run: uv run --locked --no-sync python scripts/check_moat_boundary.py
      - run: uv run --locked --no-sync python -m build
      - run: uv run --locked --no-sync python -m build packages/carl-core
  codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
        working-directory: packages/emlt-codec-ts
      - run: npm test
        working-directory: packages/emlt-codec-ts
      - run: npm run build
        working-directory: packages/emlt-codec-ts
